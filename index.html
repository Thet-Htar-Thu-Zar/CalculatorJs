<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
        integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-dark">
    <div
        class="position-absolute top-50 start-50 translate-middle row border border-secondary border-opacity-50 rounded p-2 w-25">
        <div class="p-1 col-9">
            <input class="form-control" id="Input">
        </div>
        <div class="p-1 col-3">
            <button class="btn btn-secondary w-100" onclick="Calculate()">=</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('1')">1</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('2')">2</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('3')">3</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterOperator('+')">+</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('4')">4</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('5')">5</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('6')">6</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterOperator('-')">-</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('7')">7</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('8')">8</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('9')">9</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterOperator('*')">*</button>
        </div>
        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterNumber('0')">0</button>
        </div>
        <div class="col-6 p-1">
            <button class="btn btn-secondary w-100" onclick="Clear()">Clear</button>
        </div>

        <div class="col-3 p-1">
            <button class="btn btn-secondary w-100" onclick="EnterOperator('/')">/</button>
        </div>
    </div>
</body>
<!-- <script src="test.js"></script> -->
<script src="calculator.js"></script>

</html>
